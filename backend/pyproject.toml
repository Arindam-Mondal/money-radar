[project]
name = "money-radar-backend"
version = "0.1.0"
description = "Money Radar backend: ingestion pipeline, privacy layer, API and worker"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.4",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "google-api-python-client-stubs>=1.40.0",
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle: basic style errors
    "F",        # pyflakes: unused imports/variables, undefined names
    "I",        # isort: import ordering
    "B",        # bugbear: likely bugs (mutable default args, etc.)
    "UP",       # pyupgrade: use modern syntax for py312
    "S",        # bandit: security (hardcoded secrets, shell injection, weak crypto)
    "SIM",      # simplify
    "RUF",      # ruff-specific checks
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # assert is how pytest works; bandit flags it everywhere else
    "S105", "S106", "S107",  # tests use dummy passwords/tokens on purpose; still enforced in app/
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# google-auth's Credentials has unannotated methods; allow calling them, results are Any.
untyped_calls_exclude = ["google.oauth2.credentials", "google.auth.exceptions"]

[[tool.mypy.overrides]]
# Ships no type info (no py.typed, no stubs package).
module = ["google_auth_oauthlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
