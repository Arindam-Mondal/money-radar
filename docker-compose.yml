# Shared by every service that runs the backend image (api, migrate, worker).
x-backend: &backend
  build:
    context: ./backend
  image: money-radar-backend:dev
  env_file: .env
  # Same hardening verified with docker run in 0.6.
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"  # host side configurable; containers use db:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: bring the schema to head, then exit. api only starts if this exits 0.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"  # never restart a one-shot job, or it loops after every successful exit
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    healthcheck:
      # No curl in the slim image; python is already there. urlopen raises on errors/non-2xx.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # Long-running scheduler: owns ALL Gmail traffic (one token writer, one cursor).
  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      # A writable DIRECTORY, not a file or a Docker secret (those are read-only, and
      # the atomic token save renames a temp file inside this directory).
      - ./secrets/gmail:/app/state/gmail
    healthcheck:
      # Healthy while jobs keep finishing (see app/worker/heartbeat.py).
      test: ["CMD", "python", "-m", "app.worker.heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s  # check often while starting, so `up --wait` returns quickly
    # SIGTERM -> scheduler waits for a running poll; SIGKILL after this. Poll is idempotent.
    stop_grace_period: 30s

volumes:
  pgdata:
